<!-- Red Yellow Green Brown Blue Pink Black-->
<!-- 1 2 3 4 5 6 7 -->

<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

	<link rel="stylesheet" type="text/css" href="style.css">

	<title>Car Snooker</title>
</head>
<body>
	<div id="setup">
		<h1>Car Snooker Scorer</h1>

		<ul id="names"></ul>

		<input type="text" name="enterName" id="enterName" placeholder="Enter Player Name">

		<br>

		<button onclick="addName()" id="addname">Add Name</button>
		<p id="enterNameErr" style="color: red;"></p>

		<label for="enterDuration"> Enter Duration (seconds): </label>
		<input type="text" name="enterDuration" id="enterDuration" value="45">

		<label for="numReds"> Number of Reds: </label>
		<input type="text" name="numReds" id="numReds" value="15">

		<br>

		<button onclick="start()"> Start </button>
	</div>

	<div id="turn" style="display: none;">
		<p id="turnName"></p>

		<p id="timer"></p>

		<p id="redRemaining"></p>


		<div id="scoreButtons">
			<button id="red"    class="red"    onclick="score(1)">Red</button>
			<button id="yellow" class="color"  onclick="score(2)">Yellow</button>
			<button id="green"  class="color"  onclick="score(3)">Green</button>
			<button id="brown"  class="color"  onclick="score(4)">Brown</button>
			<button id="blue"   class="color"  onclick="score(5)">Blue</button>
			<button id="pink"   class="color"  onclick="score(6)">Pink</button>
			<button id="black"  class="color"  onclick="score(7)">Black</button>

		</div>

		<button onclick="nextTurn()" id="nextTurn">Next</button>
	</div>

	<div id="end">
		<h1 id="gameOver" style="display: none;"> The game has ended </h1>
		<table id="leaderboard"></table>
	</div>


	<script src="main.js"></script>
</body>
</html>
